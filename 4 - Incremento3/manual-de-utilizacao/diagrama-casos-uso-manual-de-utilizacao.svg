<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Diagrama de casos de uso: Conecta+ — Manual de utilização</title>
  <defs>
    <marker id="seta-aberta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.2"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fff"/>

  <!-- Fronteira do sistema -->
  <rect x="240" y="40" width="620" height="430" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" font-weight="bold">Conecta+ — Manual de utilização</text>

  <!-- Associações entre o ator e os casos de uso -->
  <g stroke="#000" stroke-width="1.2"><line x1="112" y1="250" x2="311" y2="188"/><line x1="112" y1="250" x2="323" y2="353"/></g>
  <g><rect x="136" y="220" width="74" height="17" fill="#fff"/><text x="173" y="233" text-anchor="middle" font-size="12">RF-MAN-01</text><rect x="136" y="273" width="74" height="17" fill="#fff"/><text x="173" y="286" text-anchor="middle" font-size="12">RF-MAN-02</text></g>

  <!-- Caso de uso base, com ponto de extensão -->
  <ellipse cx="430" cy="160" rx="130" ry="58" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="430" y="145" text-anchor="middle">Consultar Ajuda</text>
  <line x1="312" y1="155" x2="548" y2="155" stroke="#000" stroke-width="1"/>
  <text x="430" y="173" text-anchor="middle" font-size="12" font-weight="bold">pontos de extensão</text>
  <text x="430" y="190" text-anchor="middle" font-size="12">ver manual completo</text>

  <!-- Caso de uso que estende -->
  <ellipse cx="430" cy="380" rx="115" ry="34" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="430" y="385" text-anchor="middle">Abrir manual em PDF</text>

  <!-- «extend»: sai do caso que estende e aponta para o caso base -->
  <line x1="430" y1="346" x2="430" y2="219" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#seta-aberta)"/>
  <text x="438" y="262" font-size="12">«extend»</text>

  <!-- Condição da extensão (nota UML) -->
  <line x1="430" y1="290" x2="560" y2="290" stroke="#000" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 560 258 L 828 258 L 840 270 L 840 322 L 560 322 Z" fill="#fff" stroke="#000" stroke-width="1"/>
  <path d="M 828 258 L 828 270 L 840 270" fill="none" stroke="#000" stroke-width="1"/>
  <text x="572" y="279" font-size="12">Condição: o usuário toca no botão</text>
  <text x="572" y="296" font-size="12">"Ver manual completo (PDF)"</text>
  <text x="572" y="313" font-size="12">Ponto de extensão: ver manual completo</text>

  <!-- Ator -->
  <g stroke="#000" stroke-width="1.5" fill="none"><circle cx="90" cy="220" r="11"/><line x1="90" y1="231" x2="90" y2="265"/><line x1="70" y1="243" x2="110" y2="243"/><line x1="90" y1="265" x2="74" y2="292"/><line x1="90" y1="265" x2="106" y2="292"/></g>
  <text x="90" y="312" text-anchor="middle">Usuário</text>
</svg>
