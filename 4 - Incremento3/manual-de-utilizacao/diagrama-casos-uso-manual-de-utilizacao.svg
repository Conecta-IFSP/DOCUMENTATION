<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Diagrama de casos de uso: Conecta+ — Manual de utilização</title>
  <defs>
    <marker id="seta-aberta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.2"/></marker>
  </defs>
  <rect width="960" height="430" fill="#fff"/>

  <!-- Fronteira do sistema -->
  <rect x="230" y="40" width="690" height="360" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="575" y="66" text-anchor="middle" font-weight="bold">Conecta+ — Manual de utilização</text>

  <!-- Associação ator — caso de uso -->
  <line x1="112" y1="205" x2="270" y2="205" stroke="#000" stroke-width="1.2"/>
  <rect x="152" y="184" width="78" height="17" fill="#fff"/>
  <text x="191" y="197" text-anchor="middle" font-size="12">RF-MAN-01</text>

  <!-- Caso de uso base, com ponto de extensão -->
  <ellipse cx="400" cy="205" rx="130" ry="58" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="400" y="190" text-anchor="middle">Consultar Ajuda</text>
  <line x1="282" y1="200" x2="518" y2="200" stroke="#000" stroke-width="1"/>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="bold">pontos de extensão</text>
  <text x="400" y="235" text-anchor="middle" font-size="12">ver manual completo</text>

  <!-- Caso de uso que estende -->
  <ellipse cx="765" cy="205" rx="115" ry="34" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="765" y="210" text-anchor="middle">Abrir manual em PDF</text>
  <text x="765" y="258" text-anchor="middle" font-size="12">RF-MAN-02</text>

  <!-- «extend»: sai do caso que estende e aponta para o caso base -->
  <line x1="650" y1="205" x2="531" y2="205" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#seta-aberta)"/>
  <text x="590" y="196" text-anchor="middle" font-size="12">«extend»</text>

  <!-- Condição da extensão (nota UML) -->
  <line x1="590" y1="205" x2="590" y2="300" stroke="#000" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 440 300 L 728 300 L 740 312 L 740 362 L 440 362 Z" fill="#fff" stroke="#000" stroke-width="1"/>
  <path d="M 728 300 L 728 312 L 740 312" fill="none" stroke="#000" stroke-width="1"/>
  <text x="452" y="320" font-size="12">Condição: o usuário toca no botão</text>
  <text x="452" y="337" font-size="12">"Ver manual completo (PDF)"</text>
  <text x="452" y="354" font-size="12">Ponto de extensão: ver manual completo</text>

  <!-- Ator -->
  <g stroke="#000" stroke-width="1.5" fill="none"><circle cx="90" cy="175" r="11"/><line x1="90" y1="186" x2="90" y2="220"/><line x1="70" y1="198" x2="110" y2="198"/><line x1="90" y1="220" x2="74" y2="247"/><line x1="90" y1="220" x2="106" y2="247"/></g>
  <text x="90" y="267" text-anchor="middle">Usuário</text>
</svg>
